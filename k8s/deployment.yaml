apiVersion: apps/v1
kind: Deployment
metadata:
  name: rounds
  namespace: rounds
  labels:
    app: rounds
spec:
  replicas: 2
  selector:
    matchLabels:
      app: rounds
  template:
    metadata:
      labels:
        app: rounds
    spec:
      containers:
        - name: web
          # Pinned to an immutable sha tag by .github/workflows/build.yml.
          image: ghcr.io/jhgaylor/rounds:sha-8867313eb14d7a317e7635582fa0fe98951aecb2
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 5
            periodSeconds: 20
          resources:
            requests: { cpu: 20m, memory: 96Mi }
            limits: { memory: 256Mi }
