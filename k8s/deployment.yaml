apiVersion: apps/v1
kind: Deployment
metadata:
  name: rounds
  namespace: rounds
  labels:
    app: rounds
spec:
  replicas: 2
  selector:
    matchLabels:
      app: rounds
  template:
    metadata:
      labels:
        app: rounds
    spec:
      containers:
        - name: web
          # Pinned to an immutable sha tag by .github/workflows/build.yml.
          image: ghcr.io/jhgaylor/rounds:sha-3300fc11ef20f3ac1ea09b5b118f0c1f463c355d
          ports:
            - containerPort: 8080
          # The GitHub App. Optional: without it /gh answers 503 and rounds
          # fall back to a GITHUB_TOKEN on the environment or a repo's vault.
          envFrom:
            - secretRef:
                name: rounds-github-app
                optional: true
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 5
            periodSeconds: 20
          resources:
            requests: { cpu: 20m, memory: 128Mi }
            limits: { memory: 320Mi }
